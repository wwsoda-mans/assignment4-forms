<head>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/script.js" defer></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Forms Assignment</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
        aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle navigation"><span
          class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link " href="index.html">Task 0</a></li>
          <li class="nav-item"><a class="nav-link " href="task1.html">Task 1</a></li>
          <li class="nav-item"><a class="nav-link " href="task2.html">Task 2</a></li>
          <li class="nav-item"><a class="nav-link " href="task3.html">Task 3</a></li>
          <li class="nav-item"><a class="nav-link " href="task4.html">Task 4</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <div class="form-panel">
      <h1 class="h3 mb-2">Task 2 — Bootstrap Form</h1>
      <p class="text-secondary">Bootstrap form-control, spacing and responsive grid.</p>
      <form action="#" method="get">
        <div class="row g-3">
          <div class="col-md-6"><label for="name" class="form-label">Name</label><input id="name" name="name"
              class="form-control" type="text" placeholder="Your name"></div>
          <div class="col-md-6"><label for="email" class="form-label">Email</label><input id="email" name="email"
              class="form-control" type="email" placeholder="you@example.com">
            <div class="form-text">We will not share your email.</div>
          </div>
          <div class="col-12"><label for="message" class="form-label">Message</label><textarea id="message"
              name="message" class="form-control" rows="4" placeholder="Write a message..."></textarea></div>
          <div class="col-12"><button class="btn btn-primary" type="submit">Submit</button></div>
        </div>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

  <link href="css/style.css" rel="stylesheet">
  <script src="js/script.js" defer></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Forms Assignment</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
        aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle navigation"><span
          class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link " href="index.html">Task 0</a></li>
          <li class="nav-item"><a class="nav-link " href="task1.html">Task 1</a></li>
          <li class="nav-item"><a class="nav-link " href="task2.html">Task 2</a></li>
          <li class="nav-item"><a class="nav-link " href="task3.html">Task 3</a></li>
          <li class="nav-item"><a class="nav-link " href="task4.html">Task 4</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <div class="form-panel">
      <h1 class="h3 mb-2">Task 3 — Bootstrap Validation</h1>
      <p class="text-secondary">Enter invalid data first and then correct it to see feedback.</p>
      <form data-validate novalidate>
        <div class="mb-3"><label class="form-label" for="name">Name</label><input id="name" name="name" type="text"
            class="form-control" required minlength="2">
          <div class="invalid-feedback">Enter at least 2 characters.</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email"
            class="form-control" required>
          <div class="invalid-feedback">Enter a valid email address.</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="mb-3"><label class="form-label" for="message">Message</label><textarea id="message" name="message"
            class="form-control" required minlength="10" rows="4"></textarea>
          <div class="invalid-feedback">Enter at least 10 characters.</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
        <button class="btn btn-primary" type="submit">Submit</button>
        <p class="result mt-3" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

    <div class="form-panel">
      <h1 class="h3 mb-2">Task 0 — Simple Contact Form</h1>
      <p class="text-secondary">Plain HTML inputs and labels, without validation rules.</p>
      <form action="#" method="get">
        <p><label for="name">Name</label><br><input id="name" name="name" type="text"></p>
        <p><label for="email">Email</label><br><input id="email" name="email" type="email"></p>
        <p><label for="message">Message</label><br><textarea id="message" name="message" rows="4"></textarea></p>
        <button type="submit">Submit</button>
      </form>
      <p class="small text-secondary mt-3">Demonstration only: no server is connected.</p>

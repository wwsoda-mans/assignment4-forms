  <main class="container py-5">
    <div class="form-panel">
      <h1 class="h3 mb-2">Task 1 — HTML5 Validation</h1>
      <p class="text-secondary">The browser checks required fields, email format and length.</p>
      <form action="#" method="get">
        <div class="mb-3"><label for="name" class="form-label">Name</label><input id="name" name="name" type="text"
            class="form-control" required minlength="2" maxlength="40"></div>
        <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" type="email"
            class="form-control" required></div>
        <div class="mb-3"><label for="message" class="form-label">Message</label><textarea id="message" name="message"
            class="form-control" rows="4" required minlength="10" maxlength="300"></textarea></div>
        <button class="btn btn-primary" type="submit">Submit</button>
      </form>
      <p class="small text-secondary mt-3">No JavaScript validation: the browser handles errors automatically.</p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
